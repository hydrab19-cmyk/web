
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>منصة دراسة برمجة الويب التفاعلية | مقرر الشمري</title>
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-alt: #eef2f9;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #dce3f0;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #dbeafe;
    --accent: #0ea5e9;
    --success: #10b981;
    --success-soft: #d1fae5;
    --danger: #ef4444;
    --danger-soft: #fee2e2;
    --warning: #f59e0b;
    --warning-soft: #fef3c7;
    --purple: #7c3aed;
    --purple-soft: #ede9fe;
    --code-bg: #0f172a;
    --code-text: #e2e8f0;
    --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    --radius: 14px;
    --sidebar-w: 280px;
  }

  [data-theme="dark"] {
    --bg: #0b1120;
    --surface: #131c31;
    --surface-alt: #1b2742;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #253453;
    --primary: #3b82f6;
    --primary-hover: #60a5fa;
    --primary-soft: rgba(59, 130, 246, 0.16);
    --accent: #38bdf8;
    --success: #34d399;
    --success-soft: rgba(16, 185, 129, 0.16);
    --danger: #f87171;
    --danger-soft: rgba(239, 68, 68, 0.16);
    --warning: #fbbf24;
    --warning-soft: rgba(245, 158, 11, 0.16);
    --purple: #a78bfa;
    --purple-soft: rgba(139, 92, 246, 0.16);
    --code-bg: #070b14;
    --code-text: #e2e8f0;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    min-height: 100vh;
    transition: background 0.25s, color 0.25s;
  }

  /* Layout */
  .app-shell {
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    overflow-y: auto;
    transition: transform 0.3s ease;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }

  .brand-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--purple));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.15rem;
    flex-shrink: 0;
  }

  .brand-text h1 { font-size: 1.05rem; font-weight: 800; line-height: 1.3; }
  .brand-text span { font-size: 0.78rem; color: var(--text-muted); }

  .nav-group-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    padding: 6px 12px;
    margin-top: 6px;
    text-transform: uppercase;
  }

  .nav-btn {
    width: 100%;
    text-align: right;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 11px 13px;
    border-radius: 11px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 5px;
    transition: all 0.2s;
  }

  .nav-btn:hover { background: var(--surface-alt); }
  .nav-btn.active {
    background: var(--primary-soft);
    color: var(--primary);
  }

  .nav-btn .nav-left {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
  }

  .nav-badge {
    font-size: 0.72rem;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--surface-alt);
    color: var(--text-muted);
    font-weight: 700;
    flex-shrink: 0;
  }

  .nav-badge.done {
    background: var(--success-soft);
    color: var(--success);
  }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .progress-box {
    background: var(--surface-alt);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 12px;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    font-weight: 700;
    margin-bottom: 7px;
  }

  .progress-bar {
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--success));
    width: 0%;
    transition: width 0.4s ease;
  }

  .theme-toggle {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .theme-toggle:hover { background: var(--surface-alt); }

  /* Main Content */
  .main {
    flex: 1;
    margin-right: var(--sidebar-w);
    padding: 28px 34px 60px;
    max-width: 1180px;
  }

  .mobile-topbar {
    display: none;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 90;
  }

  .menu-btn {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 9px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 95;
  }
  .overlay.show { display: block; }

  /* Hero & Headers */
  .page-hero {
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 55%, #0ea5e9 100%);
    color: #fff;
    padding: 28px 30px;
    border-radius: 18px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .page-hero .tag {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .page-hero h2 { font-size: 1.65rem; font-weight: 800; margin-bottom: 6px; }
  .page-hero p { opacity: 0.92; font-size: 0.96rem; max-width: 720px; }

  /* Dashboard Grid */
  .dash-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    margin-bottom: 24px;
  }

  .lecture-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, border-color 0.2s;
    cursor: pointer;
  }
  .lecture-card:hover {
    transform: translateY(-3px);
    border-color: var(--primary);
  }
  .lecture-card .lec-num {
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--primary);
    background: var(--primary-soft);
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    width: fit-content;
    margin-bottom: 10px;
  }
  .lecture-card h3 { font-size: 1.12rem; margin-bottom: 6px; }
  .lecture-card p { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 14px; flex: 1; }
  .lecture-card .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.82rem;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
  }

  /* Sub-Tabs inside each lecture */
  .subtabs {
    display: flex;
    gap: 8px;
    background: var(--surface);
    padding: 7px;
    border-radius: 13px;
    border: 1px solid var(--border);
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .subtab-btn {
    flex: 1;
    min-width: 130px;
    padding: 11px 16px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.94rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .subtab-btn:hover { color: var(--text); background: var(--surface-alt); }
  .subtab-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
  }

  /* Cards & Sections */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }

  .card h3 {
    font-size: 1.18rem;
    margin-bottom: 12px;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card h4 {
    font-size: 1rem;
    margin: 14px 0 8px;
    color: var(--text);
  }

  .en-term {
    direction: ltr;
    unicode-bidi: isolate;
    display: inline-block;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 0.86em;
    background: var(--surface-alt);
    color: var(--primary);
    padding: 1px 6px;
    border-radius: 6px;
    font-weight: 700;
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
    margin: 12px 0;
  }

  .mini-box {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 14px;
  }
  .mini-box strong { display: block; margin-bottom: 4px; color: var(--primary); }

  .callout {
    background: var(--warning-soft);
    border-right: 4px solid var(--warning);
    padding: 13px 16px;
    border-radius: 10px;
    margin: 14px 0;
    font-size: 0.93rem;
  }
  .callout.tip {
    background: var(--success-soft);
    border-right-color: var(--success);
  }
  .callout.info {
    background: var(--primary-soft);
    border-right-color: var(--primary);
  }

  /* Accordion */
  details.acc {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  details.acc summary {
    padding: 15px 18px;
    font-weight: 700;
    font-size: 1.02rem;
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
  }
  details.acc summary::-webkit-details-marker { display: none; }
  details.acc summary::after {
    content: "▾";
    font-size: 1.1rem;
    color: var(--primary);
    transition: transform 0.2s;
  }
  details.acc[open] summary::after { transform: rotate(180deg); }
  details.acc[open] summary { border-bottom: 1px solid var(--border); background: var(--surface-alt); }
  .acc-body { padding: 18px 20px; }

  /* Tables */
  .table-wrap { overflow-x: auto; margin: 12px 0; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  th, td {
    padding: 10px 12px;
    border: 1px solid var(--border);
    text-align: right;
  }
  th {
    background: var(--surface-alt);
    font-weight: 700;
    color: var(--primary);
  }
  tr:nth-child(even) td { background: rgba(148, 163, 184, 0.04); }

  /* Code Blocks */
  pre.code {
    direction: ltr;
    text-align: left;
    background: var(--code-bg);
    color: var(--code-text);
    padding: 15px 18px;
    border-radius: 11px;
    overflow-x: auto;
    font-family: Consolas, 'Fira Code', monospace;
    font-size: 0.88rem;
    line-height: 1.6;
    margin: 10px 0;
  }

  /* Interactive Labs */
  .lab-box {
    background: var(--surface);
    border: 2px solid var(--primary-soft);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .lab-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .lab-title h3 { font-size: 1.12rem; color: var(--primary); }

  .btn {
    padding: 9px 16px;
    border-radius: 9px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn.secondary {
    background: var(--surface-alt);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.secondary:hover { border-color: var(--primary); color: var(--primary); }
  .btn.active-pill {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .btn.success { background: var(--success); }

  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0 14px;
  }

  .input-ltr {
    width: 100%;
    direction: ltr;
    text-align: left;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    font-family: Consolas, monospace;
    font-size: 0.94rem;
    margin-bottom: 12px;
  }

  .url-parts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-top: 10px;
  }
  .url-part {
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--surface-alt);
    border-top: 4px solid var(--primary);
  }
  .url-part small { display: block; color: var(--text-muted); font-size: 0.78rem; }
  .url-part code {
    direction: ltr;
    display: block;
    font-family: Consolas, monospace;
    font-weight: 700;
    margin-top: 4px;
    word-break: break-all;
  }

  /* Split Editor */
  .split-editor {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .editor-area {
    width: 100%;
    min-height: 240px;
    direction: ltr;
    text-align: left;
    background: var(--code-bg);
    color: var(--code-text);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 14px;
    font-family: Consolas, monospace;
    font-size: 0.86rem;
    resize: vertical;
  }
  .preview-frame {
    width: 100%;
    min-height: 240px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 11px;
  }

  /* Selector Lab */
  .selector-demo {
    direction: ltr;
    text-align: left;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-family: Consolas, monospace;
    font-size: 0.88rem;
  }
  .sel-node {
    padding: 5px 10px;
    margin: 4px 0;
    border-radius: 7px;
    border: 1px dashed transparent;
    transition: all 0.25s;
  }
  .sel-node.hit {
    background: var(--warning-soft);
    border-color: var(--warning);
    color: #92400e;
    font-weight: 800;
    transform: translateX(4px);
  }
  [data-theme="dark"] .sel-node.hit { color: #fef3c7; }

  /* Box Model Simulator */
  .slider-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .slider-item {
    background: var(--surface-alt);
    padding: 10px 12px;
    border-radius: 10px;
  }
  .slider-item label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .slider-item input[type="range"] { width: 100%; accent-color: var(--primary); }

  .box-stage {
    background: var(--surface-alt);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: auto;
    min-height: 220px;
  }
  .bm-margin {
    background: rgba(245, 158, 11, 0.28);
    border: 2px dashed #f59e0b;
    display: inline-block;
    position: relative;
  }
  .bm-border {
    background: #2563eb;
    display: block;
  }
  .bm-padding {
    background: rgba(16, 185, 129, 0.28);
    display: block;
  }
  .bm-content {
    background: #3b82f6;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
    text-align: center;
  }

  /* Quiz UI */
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .q-title { font-weight: 700; font-size: 1rem; margin-bottom: 12px; }
  .q-options { display: grid; gap: 8px; }
  .q-opt {
    text-align: right;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    font-family: inherit;
    font-size: 0.93rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .q-opt:hover:not(:disabled) { border-color: var(--primary); }
  .q-opt.correct {
    background: var(--success-soft);
    border-color: var(--success);
    color: var(--success);
    font-weight: 700;
  }
  .q-opt.wrong {
    background: var(--danger-soft);
    border-color: var(--danger);
    color: var(--danger);
    font-weight: 700;
  }
  .q-explain {
    margin-top: 10px;
    padding: 10px 13px;
    border-radius: 9px;
    background: var(--primary-soft);
    font-size: 0.88rem;
    display: none;
  }
  .q-explain.show { display: block; }

  .score-banner {
    background: linear-gradient(135deg, var(--primary), var(--purple));
    color: #fff;
    padding: 20px 24px;
    border-radius: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 18px;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .sidebar { transform: translateX(100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-right: 0; padding: 18px 16px 50px; }
    .mobile-topbar { display: flex; }
    .split-editor { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="mobile-topbar">
  <strong>منصة برمجة الويب</strong>
  <button class="menu-btn" onclick="toggleSidebar()">☰ القائمة</button>
</div>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">&lt;/&gt;</div>
      <div class="brand-text">
        <h1>برمجة الويب</h1>
        <span>مقرر الشمري • د. إيفا هريكيس</span>
      </div>
    </div>

    <div class="nav-group-label">التنقل الرئيسي</div>
    <button class="nav-btn active" data-view="home" onclick="switchView('home')">
      <span class="nav-left">🏠 الرئيسية ولوحة التقدم</span>
    </button>

    <div class="nav-group-label">المحاضرات المنفصلة</div>
    <button class="nav-btn" data-view="lec1" onclick="switchView('lec1')">
      <span class="nav-left">🌐 م1: كيف يعمل الويب</span>
      <span class="nav-badge" id="badge-lec1">جديد</span>
    </button>
    <button class="nav-btn" data-view="lec2" onclick="switchView('lec2')">
      <span class="nav-left">📄 م2: مقدمة في HTML</span>
      <span class="nav-badge" id="badge-lec2">جديد</span>
    </button>
    <button class="nav-btn" data-view="lec3" onclick="switchView('lec3')">
      <span class="nav-left">🎨 م3: CSS 1 والمحددات</span>
      <span class="nav-badge" id="badge-lec3">جديد</span>
    </button>
    <button class="nav-btn" data-view="lec4" onclick="switchView('lec4')">
      <span class="nav-left">📦 م4: CSS 2 والصندوق</span>
      <span class="nav-badge" id="badge-lec4">جديد</span>
    </button>

  theme: localStorage.getItem('webprog_theme') || 'light'
};

if (state.theme === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
}

function saveState() {
  localStorage.setItem('webprog_scores', JSON.stringify(state.scores));
  localStorage.setItem('webprog_done', JSON.stringify(state.completed));
  updateProgressUI();
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';

function updateProgressUI() {

  let doneCount = 0;
  lecs.forEach(l => {

    if (state.scores[l] !== undefined) {
      badge.textContent = state.scores[l] + '%';
      badge.classList.add('done');
      doneCount++;

// ===================== VIEW RENDERERS =====================
function switchView(view) {
  state.view = view;
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setSubtab(lec, tab) {
  state.subtab[lec] = tab;
  if (tab === 'study') {
    state.completed[lec] = true;
    saveState();
  }
  render();
}

function render() {
  const main = document.getElementById('main-content');
  if (state.view === 'home') {
    main.innerHTML = renderHome();
  } else if (state.view === 'finalQuiz') {

          <tr><td><strong>تبديل الحزم (Packet Switched)</strong></td><td>تقسيم الرسالة إلى حزم مرقمة تسلك مسارات مختلفة وتُجمع عند الوجهة.</td><td>لا يتطلب اتصالاً مستمراً، مرن وقابل للتوسع (أساس الإنترنت الحديث).</td></tr>

      </div>

    <details class="acc">

      <div class="acc-body">

          <div class="mini-box"><strong>الخادم (Server)</strong>يعمل 24/7، يستمع للطلبات ويرد عليها، يستضيف التطبيقات والبيانات وينفذ مهام الأمان والتفويض.</div>
        </div>
        <p><strong>أنواع الخوادم:</strong> خوادم الويب (Web)، التطبيقات (Application)، قواعد البيانات (Database)، البريد (Mail)، الوسائط (Media)، المصادقة (Authentication)، والتحليلات (Analytics).</p>

    <details class="acc">
      <summary>القسم 3: بروتوكولات الإنترنت (TCP/IP, IPv4/IPv6)</summary>
      <div class="acc-body">
        <div class="table-wrap"><table>
          <tr><th>الطبقة</th><th>الوظيفة الأساسية</th><th>أمثلة</th></tr>
          <tr><td>التطبيقات (Application)</td><td>تتيح للتطبيقات التفاعل مع طبقة النقل.</td><td>HTTP, FTP, POP</td></tr>
          <tr><td>النقل (Transport)</td><td>تضمن وصول الإرسالات بالترتيب وبدون أخطاء (عبر Sequence Number و ACK).</td><td>TCP, UDP</td></tr>
          <tr><td>الإنترنت (Internet)</td><td>التوجيه (Routing) والعنونة (Addressing).</td><td>IPv4 (32-bit), IPv6 (128-bit)</td></tr>
          <tr><td>الربط (Link)</td><td>النقل الفيزيائي للبتات الخام (Raw Bits).</td><td>MAC</td></tr>
        </table></div>
      </div>
    </details>

    <details class="acc">
      <summary>القسم 4 و 5: نظام أسماء النطاقات (DNS) وبنية الـ URL</summary>
      <div class="acc-body">
        <p><strong>نظام DNS:</strong> يربط الأسماء المقروءة (مثل <span class="en-term">www.funwebdev.com</span>) بعناوين IP الرقمية (مثل <span class="en-term">66.147.244.79</span>). حَلَّ محل ملف <span class="en-term">hosts</span> القديم، ويتيح نقل الموقع لخادم جديد دون تغيير اسمه.</p>
        <p style="margin-top:10px;"><strong>مكونات الـ URL:</strong></p>
        <div class="table-wrap"><table>
          <tr><th>المكون</th><th>الحالة</th><th>الوظيفة</th></tr>
          <tr><td>البروتوكول (Protocol)</td><td>إلزامي</td><td>يحدد البروتوكول والمنفذ الافتراضي (HTTP=80, FTP=21).</td></tr>
          <tr><td>النطاق (Domain)</td><td>إلزامي</td><td>اسم الخادم أو عنوان IP.</td></tr>
          <tr><td>المنفذ (Port)</td><td>اختياري</td><td>نقطة اتصال برمجية (مثل رقم الباب داخل المبنى).</td></tr>
          <tr><td>المسار (Path)</td><td>اختياري</td><td>الملف أو المجلد المطلوب على الخادم.</td></tr>
          <tr><td>سلسلة الاستعلام (Query String)</td><td>اختياري</td><td>أزواج مفتاح=قيمة تبدأ بـ <span class="en-term">?</span> وتفصل بـ <span class="en-term">&amp;</span>.</td></tr>
          <tr><td>المعرف الجزئي (Fragment)</td><td>اختياري</td><td>يبدأ بـ <span class="en-term">#</span> للانتقال لجزء محدد داخل الصفحة.</td></tr>
        </table></div>
      </div>
    </details>

    <details class="acc">
      <summary>القسم 6 و 7: بروتوكول HTTP ومتصفحات الويب (Rendering & Caching)</summary>
      <div class="acc-body">
        <p><strong>طرق طلب HTTP:</strong> <span class="en-term">GET</span> (استرجاع مورد وتمرير بيانات بالـ URL)، <span class="en-term">POST</span> (إرسال بيانات داخل جسم الطلب بلا قيود طول)، <span class="en-term">HEAD</span> (جلب الترويسات فقط بدون Body).</p>
        <div class="callout"><strong>قاعدة هامة:</strong> لا تستخدم GET أبداً لتغيير حالة البيانات (التعديل أو الحذف)، بل استخدم POST أو PUT/DELETE.</div>
        <p><strong>فئات رموز الاستجابة:</strong> <span class="en-term">2xx</span> نجاح (200 OK) • <span class="en-term">3xx</span> إعادة توجيه/تخزين مؤقت (301, 304, 307) • <span class="en-term">4xx</span> أخطاء العميل (400, 401, 404, 414) • <span class="en-term">5xx</span> أخطاء الخادم (500).</p>
        <p style="margin-top:10px;"><strong>مقاييس التصيير (Browser Rendering):</strong> <span class="en-term">TTFB</span> (أول بايت) ← <span class="en-term">FP</span> (أول تغيير مرئي) ← <span class="en-term">FCP</span> (أول محتوى) ← <span class="en-term">FMP</span> (المحتوى الأساسي) ← <span class="en-term">LCP</span> (أكبر عنصر) ← <span class="en-term">TTI</span> (الجاهزية للتفاعل) ← <span class="en-term">On Load</span>. بينما <span class="en-term">CLS</span> يقيس الاستقرار البصري.</p>
        <p style="margin-top:8px;"><strong>التخزين المؤقت (Browser Caching):</strong> يتحقق المتصفح إن كانت النسخة المخزنة حديثة (Fresh) فيستخدمها مباشرة لتقليل حركة الشبكة.</p>
      </div>
    </details>
  `;

  if (lecId === 'lec2') return `
    <details class="acc" open>

        <div class="info-grid">
          <div class="mini-box"><strong>الأب والابن (Parent & Child)</strong>العنصر الحاوي المباشر هو الأب، وما بداخله مباشرةً هو الابن.</div>
          <div class="mini-box"><strong>الأشقاء (Siblings)</strong>العناصر التي تشترك في نفس الأب المباشر.</div>

    <details class="acc">

<pre class="code">&lt;!DOCTYPE html&gt;

    <details class="acc">
      <summary>القسم 5: العناصر الكتلية مقابل السطرية (Block vs Inline)</summary>
      <div class="acc-body">
        <div class="table-wrap"><table>
          <tr><th>الفئة</th><th>السلوك</th><th>أمثلة</th></tr>
          <tr><td><strong>كتلية (Block-level)</strong></td><td>تبدأ سطراً جديداً، تملأ عرض الأب، تقبل width و height.</td><td>div, p, h1-h6, ul, ol, table, form, section, article</td></tr>
          <tr><td><strong>سطرية (Inline)</strong></td><td>تتدفق أفقياً داخل السطر، ليس لها width أو height محدد.</td><td>span, a, em, strong, code, small, time, br</td></tr>
          <tr><td><strong>سطرية-كتلية (Inline-block)</strong></td><td>سطرية ولكنها تقبل تحديد العرض والارتفاع.</td><td>img</td></tr>
        </table></div>
        <p>يمكن تغيير سلوك أي عنصر عبر خاصية CSS: <span class="en-term">display: block / inline / inline-block</span>.</p>
      </div>
    </details>
  `;

  if (lecId === 'lec3') return `
    <details class="acc" open>
      <summary>القسم 1 و 2: ما هي CSS، فوائدها، بناء الجملة، الألوان، ووحدات القياس</summary>
      <div class="acc-body">
        <p><strong>فوائد CSS الخمس:</strong> تحكم أفضل في التنسيق، قابلية صيانة عالية، تحسين إمكانية الوصول (Accessibility)، سرعة تحميل الصفحات، ومرونة المخرجات (Responsive Design).</p>
        <p style="margin-top:8px;"><strong>بناء الجملة:</strong> <span class="en-term">selector { property: value; }</span>، والتعليقات تُكتب بـ <span class="en-term">/* comment */</span>.</p>
        <h4>طرق وصف الألوان</h4>
        <p>الأسماء القياسية (<span class="en-term">red</span>)، <span class="en-term">rgb(255,0,0)</span>، السداسي عشر <span class="en-term">#FF0000</span>، الشفافية <span class="en-term">rgba(255,0,0,0.5)</span>، و <span class="en-term">hsl / hsla</span> في CSS3.</p>
        <h4>وحدات القياس النسبية مقابل المطلقة</h4>
        <div class="table-wrap"><table>
          <tr><th>الوحدة</th><th>النوع</th><th>الشرح</th></tr>
          <tr><td><span class="en-term">px</span></td><td>نسبي (CSS2) / مطلق (CSS3)</td><td>بكسل واحد يساوي 1/96 بوصة في CSS3.</td></tr>
          <tr><td><span class="en-term">em</span></td><td>نسبي</td><td>منسوب لحجم خط الأب — <strong>يتراكم (Compounds)</strong> مع التداخل.</td></tr>
          <tr><td><span class="en-term">rem</span></td><td>نسبي (CSS3)</td><td>منسوب لجذر المستند <span class="en-term">&lt;html&gt;</span> — <strong>لا يتراكم</strong>.</td></tr>
          <tr><td><span class="en-term">%, vw, vh</span></td><td>نسبي</td><td>نسبة من الأب (%) أو من نافذة العرض (vw, vh).</td></tr>
          <tr><td><span class="en-term">in, cm, mm, pt, pc</span></td><td>مطلق</td><td>قياسات فيزيائية ثابتة (1pt = 1/72 بوصة).</td></tr>
        </table></div>
      </div>
    </details>

    <details class="acc">
      <summary>القسم 3: مواقع الأنماط وأنواع صفحات الأنماط</summary>
      <div class="acc-body">
        <div class="info-grid">
          <div class="mini-box"><strong>1. السطري (Inline)</strong>داخل خاصية <span class="en-term">style="..."</span>. يلغي التنسيقات الأخرى لكنه سيء للصيانة.</div>
          <div class="mini-box"><strong>2. المضمّن (Embedded)</strong>داخل <span class="en-term">&lt;style&gt;</span> في <span class="en-term">&lt;head&gt;</span>. لصفحة واحدة فقط.</div>
          <div class="mini-box"><strong>3. الخارجي (External)</strong>ملف <span class="en-term">.css</span> عبر <span class="en-term">&lt;link&gt;</span>. الأفضل والأسرع (يدعم الـ Cache).</div>
        </div>
        <p><strong>أنواع صفحات الأنماط الثلاثة:</strong> المؤلف (Author)، المستخدم (User)، والمتصفح (Browser Default).</p>
      </div>
    </details>

    <details class="acc">
      <summary>القسم 4: جميع أنواع محددات CSS (Selectors)</summary>
      <div class="acc-body">
        <div class="table-wrap"><table>
          <tr><th>النوع</th><th>أمثلة</th><th>الوظيفة</th></tr>
          <tr><td>العنصر / الشامل / المجمّع</td><td><span class="en-term">p</span> • <span class="en-term">*</span> • <span class="en-term">h1, h2</span></td><td>استهداف نوع عنصر، أو كل العناصر، أو عدة عناصر معاً.</td></tr>
          <tr><td>الفئة (Class) والمعرّف (ID)</td><td><span class="en-term">.circle</span> • <span class="en-term">#first</span></td><td>الفئة تتكرر ويمكن دمجها، والمعرف فريد مرة واحدة بالصفحة.</td></tr>
          <tr><td>محددات الخصائص</td><td><span class="en-term">[title]</span> • <span class="en-term">[href^="mailto"]</span> • <span class="en-term">[href$=".pdf"]</span> • <span class="en-term">[src*="flag"]</span></td><td>المطابقة حسب وجود الخاصية أو بدايتها (^) أو نهايتها ($) أو احتوائها (*).</td></tr>
          <tr><td>الفئات والعناصر الزائفة</td><td><span class="en-term">:hover</span> • <span class="en-term">:focus</span> • <span class="en-term">:nth-child(2n)</span> • <span class="en-term">:first-letter</span></td><td>الفئات الزائفة لحالة العنصر، والعناصر الزائفة لجزء من النص.</td></tr>
          <tr><td>السياقية (Combinators)</td><td><span class="en-term">div p</span> (حفيد) • <span class="en-term">div &gt; p</span> (ابن مباشر) • <span class="en-term">hr + p</span> (شقيق مجاور) • <span class="en-term">h3 ~ p</span> (شقيق عام)</td><td>اختيار العناصر بناءً على علاقاتها في شجرة المستند.</td></tr>

  if (lecId === 'lec4') return `
    <details class="acc" open>
      <summary>القسم 1: التتالي في CSS (The Cascade: Inheritance, Specificity, Location)</summary>
      <div class="acc-body">
        <div class="info-grid">

          <div class="mini-box"><strong>2. التخصيص (Specificity)</strong>الوزن التصاعدي: الوراثة ← Element ← Class ← ID. الأكثر تحديداً يفوز.</div>

      <div class="acc-body">

        <pre class="code">Total Width  = width  + padding(L+R) + border(L+R) + margin(L+R)
Total Height = height + padding(T+B) + border(T+B) + margin(T+B)</pre>
        <ul>
          <li><strong>قاعدة عقارب الساعة (TRBL):</strong> <span class="en-term">Top, Right, Bottom, Left</span>.</li>
          <li><strong>انهيار الهوامش العمودية (Collapsing Margins):</strong> عند تلامس هامشين عموديين يُعرض الأكبر فقط (الأفقية لا تنهار أبداً).</li>
          <li><strong>المشكلات الأربع لـ width/height:</strong> (1) لا تُطبّق على السطرية النصية. (2) افتراضياً <span class="en-term">content-box</span> يزيد الأبعاد؛ الحل <span class="en-term">box-sizing: border-box</span>. (3) فيضان المحتوى يُعالج بـ <span class="en-term">overflow: visible | hidden | scroll | auto</span>. (4) الأبعاد بـ % تحتاج قيود <span class="en-term">min-width / max-width</span>.</li>
        </ul>
      </div>
    </details>

    <details class="acc">
      <summary>القسم 3: تنسيق النصوص والخطوط (Text & Font Styling)</summary>
      <div class="acc-body">
        <p><strong>مكدس الخطوط (Web Font Stack):</strong> توفير بدائل مرتبة بالأولوية تنتهي بعائلة عامة (<span class="en-term">serif, sans-serif, monospace, cursive, fantasy</span>)، ويمكن تحميل خط مخصص عبر <span class="en-term">@font-face</span>.</p>
        <p style="margin-top:8px;"><strong>خصائص الخط:</strong> <span class="en-term">font-family, font-size, font-style, font-variant, font-weight</span> (من 100 إلى 900).</p>
        <p style="margin-top:8px;"><strong>خصائص الفقرة:</strong> <span class="en-term">letter-spacing, word-spacing, line-height, text-align, text-decoration, direction (rtl/ltr), text-indent, text-shadow, text-transform, vertical-align</span>.</p>
      </div>
    </details>
  `;
}

    ...QUIZZES.lec2.slice(0, 4),
    ...QUIZZES.lec3.slice(0, 4),
    ...QUIZZES.lec4.slice(0, 4)
  ];
  window._finalQuestions = all;
  return `
    <div class="page-hero">
      <span class="tag">مراجعة نهائية • 16 سؤالاً</span>
      <h2>🏆 الاختبار الشامل لمادة برمجة الويب</h2>
      <p>يجمع هذا الاختبار أهم الأسئلة من المحاضرات الأربع لقياس جاهزيتك الكاملة للامتحان.</p>
    </div>
    ${renderQuizHTML('final', all, 'الاختبار الشامل (المحاضرات 1 إلى 4)')}
  `;
}

function answerQuestion(lecId, qIdx, chosen, correct, total, isFinal) {
  if (activeQuizAnswers[qIdx] !== undefined) return;
  activeQuizAnswers[qIdx] = (chosen === correct);

  const card = document.getElementById('qcard-' + qIdx);
  const btns = card.querySelectorAll('.q-opt');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === correct) b.classList.add('correct');
    else if (i === chosen && chosen !== correct) b.classList.add('wrong');
  });
  document.getElementById('qexp-' + qIdx).classList.add('show');

  const answeredCount = Object.keys(activeQuizAnswers).length;
  if (answeredCount === total) {
    const rightCount = Object.values(activeQuizAnswers).filter(Boolean).length;
    const pct = Math.round((rightCount / total) * 100);
    if (!isFinal) {
      state.scores[lecId] = pct;
      state.completed[lecId] = true;
      saveState();
    }
    const banner = document.getElementById('score-banner');
    banner.style.display = 'flex';
    document.getElementById('score-title').textContent = `نتيجتك: ${rightCount} من ${total} (${pct}%)`;
    document.getElementById('score-msg').textContent = pct >= 85 ? 'ممتاز جداً! إتقان رائع لمحتوى المحاضرة 🌟' : (pct >= 60 ? 'جيد! راجع الأسئلة التي أخطأت بها لتصل لـ 100% 👍' : 'أنصحك بمراجعة تبويب الشرح والمختبر ثم المحاولة مجدداً 📖');
  }
}

function resetQuiz(lecId, isFinal) {
  if (isFinal) render();
  else setSubtab(lecId, 'quiz');
}

// ===================== INTERACTIVE WIDGETS LOGIC =====================
function initInteractiveWidgets(lecId) {
  if (state.subtab[lecId] !== 'lab') return;
  if (lecId === 'lec1') { analyzeURL(); renderHttpSim(); }
  if (lecId === 'lec2') { loadHtmlPreset('semantic'); }
  if (lecId === 'lec3') { testSelector('ul a'); updateUnitsLab(); }
  if (lecId === 'lec4') { updateBoxModel(); }
}

// --- Lec 1: URL Analyzer ---
function setSampleURL(u) {
  document.getElementById('url-input').value = u;
  analyzeURL();
}
function analyzeURL() {
  const input = document.getElementById('url-input');
  const out = document.getElementById('url-output');
  if (!input || !out) return;
  try {
    const u = new URL(input.value.trim());
    const parts = [
      { label: 'البروتوكول (Protocol) - إلزامي', val: u.protocol.replace(':',''), color: '#2563eb' },
      { label: 'النطاق (Domain) - إلزامي', val: u.hostname, color: '#0ea5e9' },
      { label: 'المنفذ (Port) - اختياري', val: u.port || '(افتراضي)', color: '#7c3aed' },
      { label: 'المسار (Path) - اختياري', val: u.pathname || '/', color: '#10b981' },
      { label: 'سلسلة الاستعلام (Query) - اختياري', val: u.search || '(لا يوجد)', color: '#f59e0b' },
      { label: 'المعرف الجزئي (Fragment) - اختياري', val: u.hash || '(لا يوجد)', color: '#ef4444' }
    ];
    out.innerHTML = parts.map(p => `
      <div class="url-part" style="border-top-color:${p.color}">
        <small>${p.label}</small>
        <code>${p.val}</code>
      </div>
    `).join('');
  } catch (e) {
    out.innerHTML = `<div class="callout" style="grid-column:1/-1;">أدخل رابطاً صالحاً يبدأ ببروتوكول مثل <span class="en-term">http://</span> أو <span class="en-term">https://</span></div>`;
  }
}

// --- Lec 1: HTTP Simulator ---
let httpState = { method: 'GET', code: 200 };
const HTTP_INFO = {
  200: { text: '200 OK', desc: 'نُفّذ الطلب بنجاح وأعاد الخادم المورد المطلوب.' },
  301: { text: '301 Moved Permanently', desc: 'تم نقل المورد بشكل دائم إلى عنوان جديد (تُحدّث محركات البحث فهرسها).' },
  304: { text: '304 Not Modified', desc: 'النسخة المخزنة مؤقتاً (Cache) لدى المتصفح لا تزال حديثة، لذا يعيد الخادم ترويسات فقط.' },
  401: { text: '401 Unauthorized', desc: 'المورد محمي ويتطلب تقديم بيانات اعتماد (Credentials).' },
  404: { text: '404 Not Found', desc: 'المورد المطلوب غير موجود على الخادم.' },
  414: { text: '414 Request URI Too Long', desc: 'الرابط طويل جداً وتجاوز الحد الأقصى للخادم (غالباً بسبب بيانات كثيرة في GET).' },
  500: { text: '500 Internal Server Error', desc: 'حدث خطأ داخلي غير متوقع في الخادم دون تفاصيل للعميل.' }
};
function setHttpMethod(m, btn) {
  httpState.method = m;
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-pill'));
  btn.classList.add('active-pill');
  renderHttpSim();
}
function setHttpCode(c, btn) {
  httpState.code = c;
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-pill'));
  btn.classList.add('active-pill');
  renderHttpSim();
}
function renderHttpSim() {
  const req = document.getElementById('http-req-box');
  const res = document.getElementById('http-res-box');
  const exp = document.getElementById('http-explain');
  if (!req) return;
  const path = httpState.method === 'POST' ? '/FormProcess.php' : '/index.html';
  req.textContent = `${httpState.method} ${path} HTTP/1.1\nHost: example.com\nUser-Agent: Mozilla/5.0\nAccept: text/html\nConnection: keep-alive${httpState.method==='POST' ? '\n\nusername=ali&course=web' : ''}`;
  const info = HTTP_INFO[httpState.code];
  const hasBody = httpState.method !== 'HEAD' && httpState.code !== 304;
  res.textContent = `HTTP/1.1 ${info.text}\nServer: Apache\nContent-Type: text/html\nContent-Length: ${hasBody ? '4538' : '0'}${hasBody ? '\n\n<html><body>...</body></html>' : '\n\n(No Body returned)'}`;
  exp.innerHTML = `<strong>${httpState.method} + ${info.text}:</strong> ${info.desc}` + (httpState.method === 'HEAD' ? ' — لاحظ أن طريقة <strong>HEAD</strong> تُعيد الترويسات فقط بدون جسم الصفحة لتوفير عرض النطاق.' : '');
}

// --- Lec 2: HTML Sandbox ---
const HTML_PRESETS = {
  semantic: `<header style="background:#1e3a8a;color:#fff;padding:10px;border-radius:6px;">
  <h2 style="margin:0;">مدونة برمجة الويب</h2>
</header>
<nav style="margin:8px 0;">
  <a href="#sec1">المقال</a> | <a href="#sec2">ملاحظة</a>
</nav>
<main>
  <article id="sec1" style="background:#f1f5f9;padding:10px;border-radius:6px;">
    <h3>مقال مستقل (article)</h3>
    <p>نستخدم <strong>HTML5</strong> لكتابة كود دلالي نظيف.</p>
  </article>
</main>
<footer style="margin-top:10px;font-size:12px;color:#64748b;">&copy; 2026 جميع الحقوق محفوظة</footer>`,
  blockinline: `<h3>الفرق بين Block و Inline:</h3>
<div style="background:#dbeafe;padding:6px;margin-bottom:6px;">أنا &lt;div&gt; (عنصر كتلي يأخذ كامل السطر)</div>
<p style="background:#dcfce7;padding:6px;">أنا &lt;p&gt; كتلي، وبداخلي <span style="background:#fef08a;padding:2px 6px;">عنصر &lt;span&gt; سطري</span> و <strong>&lt;strong&gt; سطري</strong> دون كسر السطر.</p>`,
  details: `<h3>أداة الكشف التفاعلية (HTML 5.1):</h3>
<details open style="border:1px solid #cbd5e1;padding:10px;border-radius:8px;">
  <summary style="font-weight:bold;cursor:pointer;color:#2563eb;">اضغط هنا لإظهار/إخفاء المعلومة</summary>
  <p>وسما &lt;details&gt; و &lt;summary&gt; يتيحان إخفاء وإظهار المحتوى بدون أي سطر JavaScript!</p>
</details>`,
  entities: `<h3>كيانات الأحرف (Character Entities):</h3>
<p>لعرض وسم HTML كنص نكتب: &lt;p&gt;Hello&lt;/p&gt;</p>
<p>رموز خاصة: &copy; حقوق النشر | &euro; يورو | &trade; علامة تجارية</p>
<p>مسافات متعددة:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;باستخدام &amp;nbsp;</p>`
};
function loadHtmlPreset(key) {
  const ed = document.getElementById('html-editor');
  if (!ed) return;
  ed.value = HTML_PRESETS[key];
  runHtmlSandbox();
}
function runHtmlSandbox() {
  const ed = document.getElementById('html-editor');
  const frame = document.getElementById('html-preview');
  if (!ed || !frame) return;
  frame.srcdoc = `<html dir="rtl"><body style="font-family:Segoe UI,Tahoma,sans-serif;padding:12px;line-height:1.6;">${ed.value}</body></html>`;
}

// --- Lec 3: Selector Lab & Units Lab ---
const SEL_MAP = {
  'ul a': { tag: 'ul-a', desc: '<strong>Descendant Selector:</strong> يطابق كل الروابط &lt;a&gt; الموجودة في أي مستوى داخل &lt;ul&gt;.' },
  '#main > time': { tag: 'main-child-time', desc: '<strong>Direct Child (&gt;):</strong> يطابق فقط &lt;time&gt; الابن المباشر لـ #main (2019-12-25) ويتجاهل الموجود داخل &lt;p&gt;.' },
  'div time': { tag: 'div-time', desc: '<strong>Descendant Selector:</strong> يطابق كل &lt;time&gt; داخل &lt;div&gt; سواء كان ابناً مباشراً أو حفيداً داخل &lt;p&gt;.' },
  'hr + p': { tag: 'hr-plus-p', desc: '<strong>Adjacent Sibling (+):</strong> يطابق أول فقرة &lt;p&gt; تأتي مباشرةً بعد كل &lt;hr&gt; فقط.' },
  'h3 ~ p': { tag: 'h3-tilde-p', desc: '<strong>General Sibling (~):</strong> يطابق جميع فقرات &lt;p&gt; التي تأتي بعد &lt;h3&gt; وتشترك معها في نفس الأب.' }
};
function testSelector(sel, btn) {
  if (btn) {
    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-pill'));
    btn.classList.add('active-pill');
  }
  const info = SEL_MAP[sel];
  document.querySelectorAll('#selector-tree .sel-node').forEach(node => {
    const tags = (node.dataset.tags || '').split(' ');
    node.classList.toggle('hit', tags.includes(info.tag));
  });
  const exp = document.getElementById('sel-explain');
  if (exp) exp.innerHTML = info.desc;
}

function updateUnitsLab() {
  const r = Number(document.getElementById('rng-root').value);
  const c = Number(document.getElementById('rng-card').value);
  document.getElementById('val-root').textContent = r + 'px';
  document.getElementById('val-card').textContent = c + 'px';
  const em1 = (c * 1.2).toFixed(1);
  const em2 = (c * 1.2 * 1.2).toFixed(1);
  const rem = (r * 1.2).toFixed(1);
  document.getElementById('units-result').innerHTML = `
    <div class="mini-box"><strong>.label-em (1.2em)</strong><span style="font-size:${em1}px">حجم: ${em1}px</span><small style="display:block;color:var(--text-muted)">${c} × 1.2</small></div>
    <div class="mini-box"><strong>.nested-em (1.2em متداخل)</strong><span style="font-size:${em2}px;color:var(--danger)">حجم: ${em2}px</span><small style="display:block;color:var(--text-muted)">تراكم! ${em1} × 1.2</small></div>
    <div class="mini-box"><strong>.label-rem و .nested-rem (1.2rem)</strong><span style="font-size:${rem}px;color:var(--success)">حجم: ${rem}px</span><small style="display:block;color:var(--text-muted)">ثابت نسبة للجذر (${r} × 1.2) — لا تراكم</small></div>
  `;
}

// --- Lec 4: Box Model Simulator ---
let bmSizing = 'content-box';
function setBoxSizing(mode) {
  bmSizing = mode;
  document.getElementById('btn-content-box').classList.toggle('active-pill', mode === 'content-box');
  document.getElementById('btn-border-box').classList.toggle('active-pill', mode === 'border-box');
  updateBoxModel();
}
function updateBoxModel() {
  const w = Number(document.getElementById('bm-w').value);
  const p = Number(document.getElementById('bm-p').value);
  const b = Number(document.getElementById('bm-b').value);
  const m = Number(document.getElementById('bm-m').value);
  document.getElementById('bm-v-w').textContent = w + 'px';
  document.getElementById('bm-v-p').textContent = p + 'px';
  document.getElementById('bm-v-b').textContent = b + 'px';
  document.getElementById('bm-v-m').textContent = m + 'px';

  const contentW = bmSizing === 'content-box' ? w : Math.max(20, w - 2*p - 2*b);
  const totalW = bmSizing === 'content-box' ? (w + 2*p + 2*b + 2*m) : (w + 2*m);

  document.getElementById('bm-stage').innerHTML = `
    <div class="bm-margin" style="padding:${m}px;">
      <div class="bm-border" style="padding:${b}px;">
        <div class="bm-padding" style="padding:${p}px;">
          <div class="bm-content" style="width:${contentW}px;height:64px;">
            Content (${contentW}px)
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('bm-math').innerHTML = bmSizing === 'content-box'
    ? `<strong>box-sizing: content-box:</strong> العرض الكلي = ${w} (width) + ${2*p} (padding) + ${2*b} (border) + ${2*m} (margin) = <strong>${totalW}px</strong>`
    : `<strong>box-sizing: border-box:</strong> الـ width (${w}px) يشمل الحشو والحدود، لذا العرض الكلي = ${w} + ${2*m} (margin) = <strong>${totalW}px</strong>`;
}

function setOverflowDemo(val, btn) {
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-pill'));
  btn.classList.add('active-pill');
  document.getElementById('overflow-box').style.overflow = val;
}

// Initial Render
render();
</script>
